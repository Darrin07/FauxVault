name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fauxvault
          POSTGRES_USER: fauxvault_user
          POSTGRES_PASSWORD: fauxvault_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fauxvault_user -d fauxvault"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_DB: fauxvault
      POSTGRES_USER: fauxvault_user
      POSTGRES_PASSWORD: fauxvault_pass
      DB_HOST: localhost
      DB_PORT: 5432
      JWT_SECRET: ci-test-secret
      RESTRICTED_DB_USER: fauxvault_sqli_lab
      # CI-only placeholder. The CI Postgres is ephemeral and localhost-bound;
      # this value is the agreement between role provisioning (below) and the
      # restrictedPool config in tests. Not a real secret -- do not reuse anywhere.
      RESTRICTED_DB_PASSWORD: ci_only_not_a_real_secret
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: psql -h "$DB_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f
          ../database/FauxVault_Schema.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Seed database
        run: psql -h "$DB_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f
          ../database/FauxVault_Seed.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Provision SQLi sandbox role
        # Use sed (not psql -v) because :'foo' inside DO $$ ... $$ is dollar-quoted
        # text and psql variable substitution does not enter dollar-quoted blocks.
        # Matches the sed approach in package.json's db:init script.
        run: |
          set -o pipefail
          sed "s|:'sqli_lab_password'|'$RESTRICTED_DB_PASSWORD'|g" ../database/FauxVault_SQLi_Lab_Role.sql \
            | psql -h "$DB_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint -- --ignore-pattern server/

      - name: Run frontend tests
        run: npm test -- --run

  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo ==> Checking .env exists...",
              "if [ ! -f ${{ secrets.EC2_APP_DIR }}/.env ]; then echo ERROR: .env missing; exit 1; fi",
              "echo ==> Pulling latest code...",
              "cd ${{ secrets.EC2_APP_DIR }}",
              "git pull origin main",
              "echo ==> Pruning Docker...",
              "docker system prune -f",
              "echo ==> Rebuilding containers...",
              "export DOCKER_BUILDKIT=0",
              "docker compose down",
              "docker compose up -d --build",
              "echo ==> Waiting for app to start...",
              "sleep 30",
              "echo ==> Running DB init...",
              "npm run db:init",
              "echo ==> Health check...",
              "curl -f http://localhost/api/settings || (echo ERROR: Health check failed && exit 1)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          set +e
          WAIT_SECONDS=0
          MAX_WAIT=600
          POLL_INTERVAL=15
          STATUS="Pending"
          while [ $WAIT_SECONDS -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query "Status" \
              --output text)
            STATUS_RC=$?
            echo "SSM status after ${WAIT_SECONDS}s: $STATUS"

            if [ $STATUS_RC -ne 0 ]; then
              echo "SSM status check failed; retrying..."
            else
              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut|Cancelling)
                  break
                  ;;
                Pending|InProgress|Delayed)
                  ;;
                *)
                  echo "Unknown SSM status: $STATUS"
                  break
                  ;;
              esac
            fi

            sleep $POLL_INTERVAL
            WAIT_SECONDS=$((WAIT_SECONDS + POLL_INTERVAL))
          done
          set -e

          WAIT_STATUS=0
          if [ "$STATUS" != "Success" ]; then
            WAIT_STATUS=1
          fi

          echo "SSM status: $STATUS"
          echo "==> SSM stdout"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardOutputContent" \
            --output text

          echo "==> SSM stderr"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardErrorContent" \
            --output text

          test "$WAIT_STATUS" = "0"
          test "$STATUS" = "Success"
